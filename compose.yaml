services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petstore}
      POSTGRES_USER: ${POSTGRES_USER:-petstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs:/logs
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  importer:
    image: petshop-qa:local
    build: .
    working_dir: /app
    volumes:
      - ./scripts:/app:ro
      - ./logs:/logs
    environment:
      PET_NAME_PREFIX: ${PET_NAME_PREFIX:-M}
      PETSTORE_URL: ${PETSTORE_URL:-https://petstore.swagger.io/v2}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-petstore}
      POSTGRES_USER: ${POSTGRES_USER:-petstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-c", "set -o pipefail; date -u '+--- Import started %Y-%m-%dT%H:%M:%SZ ---' | tee -a /logs/importer.log; python app.py 2>&1 | tee -a /logs/importer.log; status=$$?; echo Exit code: $$status | tee -a /logs/importer.log; exit $$status"]

  api-tests:
    image: petshop-qa:local
    build: .
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./scripts:/app:ro
      - ./logs:/logs
    environment:
      PETSTORE_URL: ${PETSTORE_URL:-https://petstore.swagger.io/v2}
      PYTHONUNBUFFERED: "1"
    command:
      - bash
      - -c
      - |
        set -o pipefail
        date -u '+--- API tests started %Y-%m-%dT%H:%M:%SZ ---' | tee -a /logs/api-tests.log
        SECONDS=0
        python -m unittest -v test_api 2>&1 | tee -a /logs/api-tests.log
        status=$$?
        date -u '+Finished: %Y-%m-%dT%H:%M:%SZ' | tee -a /logs/api-tests.log
        echo "Duration: $${SECONDS}s; exit code: $$status" | tee -a /logs/api-tests.log
        exit $$status

volumes:
  postgres_data:
